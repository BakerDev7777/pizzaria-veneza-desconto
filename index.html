    <!-- Lead ID sync: reescreve utm_source/xcod com o leadId persistido -->
    <script>
    (function () {
      const POLL_MS = 500;
      const UTM_SEP = "jLj";
      const XCOD_SEP = "hQwK21wXxR";

      const STORAGE_KEY = { FB: "lead", google: "lead-google" };

      function getOrigin(utmSource) {
        if (!utmSource) return null;
        const base = utmSource.split(UTM_SEP)[0];
        return base === "FB" || base === "google" ? base : null;
      }

      function getLeadIdFromStorage(origin) {
        const key = STORAGE_KEY[origin];
        if (!key) return null;
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        try {
          const obj = JSON.parse(raw);
          return obj && obj._id ? String(obj._id) : null;
        } catch {
          return null;
        }
      }

      function resolveLeadId(utmSource, origin) {
        const prefix = origin + UTM_SEP;
        if (utmSource && utmSource.startsWith(prefix)) {
          const id = utmSource.slice(prefix.length);
          if (id) return id;
        }
        return getLeadIdFromStorage(origin);
      }

      function applyIfNeeded() {
        const url = new URL(window.location.href);
        const currentSource = url.searchParams.get("utm_source");
        const origin = getOrigin(currentSource);
        if (!origin) return false;

        const id = resolveLeadId(currentSource, origin);
        if (!id) return false;

        const desired = origin + UTM_SEP + id;
        let changed = false;

        if (currentSource !== desired) {
          url.searchParams.set("utm_source", desired);
          changed = true;
        }

        const currentXcod = url.searchParams.get("xcod");
        if (currentXcod) {
          const parts = currentXcod.split(XCOD_SEP);
          if (parts[0] !== desired) {
            parts[0] = desired;
            url.searchParams.set("xcod", parts.join(XCOD_SEP));
            changed = true;
          }
        }

        if (!changed) return true;
        window.location.replace(url.toString());
        return true;
      }

      if (applyIfNeeded()) return;
      const interval = setInterval(() => {
        if (applyIfNeeded()) clearInterval(interval);
      }, POLL_MS);
    })();
    </script>

  <script>
  (function(){
    var KEYS=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','fbclid','src','sck','xcod','keyword','device','network'];
    var STORAGE_KEY='__utms';
    function parse(qs){var p=new URLSearchParams(qs||'');var o={};KEYS.forEach(function(k){var v=p.get(k);if(v)o[k]=v;});return o;}
    function load(){try{return JSON.parse(sessionStorage.getItem(STORAGE_KEY)||'{}');}catch(e){return {};}}
    function save(o){try{sessionStorage.setItem(STORAGE_KEY,JSON.stringify(o));}catch(e){}}
    function merge(a,b){var o={};for(var k in a)o[k]=a[k];for(var k in b)o[k]=b[k];return o;}
    var fromUrl=parse(location.search);
    var stored=load();
    var utms=merge(stored,fromUrl);
    if(Object.keys(utms).length)save(utms);
    function appendToUrl(url){
      if(!url||typeof url!=='string')return url;
      if(/^(mailto:|tel:|javascript:|#)/i.test(url))return url;
      try{
        var isAbs=/^https?:\/\//i.test(url);
        var u=isAbs?new URL(url):new URL(url,location.origin);
        if(isAbs && u.origin!==location.origin)return url;
        var changed=false;
        Object.keys(utms).forEach(function(k){if(!u.searchParams.has(k)){u.searchParams.set(k,utms[k]);changed=true;}});
        if(!changed)return url;
        return isAbs?u.toString():(u.pathname+u.search+u.hash);
      }catch(e){return url;}
    }
    // Reapply to current URL if missing
    if(Object.keys(utms).length){
      var cur=parse(location.search);
      var missing=Object.keys(utms).some(function(k){return !cur[k];});
      if(missing){
        try{
          var u=new URL(location.href);
          Object.keys(utms).forEach(function(k){if(!u.searchParams.has(k))u.searchParams.set(k,utms[k]);});
          history.replaceState(history.state,'',u.pathname+u.search+u.hash);
        }catch(e){}
      }
    }
    function rewriteAnchors(root){
      var as=(root||document).querySelectorAll('a[href]');
      for(var i=0;i<as.length;i++){
        var a=as[i];
        var h=a.getAttribute('href');
        var nh=appendToUrl(h);
        if(nh && nh!==h)a.setAttribute('href',nh);
      }
    }
    rewriteAnchors();
    if('MutationObserver' in window){
      new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){
          var m=muts[i];
          for(var j=0;j<m.addedNodes.length;j++){
            var n=m.addedNodes[j];
            if(n.nodeType!==1)continue;
            if(n.tagName==='A')rewriteAnchors({querySelectorAll:function(){return [n];}});
            else if(n.querySelectorAll)rewriteAnchors(n);
          }
        }
      }).observe(document.documentElement,{childList:true,subtree:true});
    }
    // Wrap location methods
    try{
      var origAssign=window.location.assign.bind(window.location);
      var origReplace=window.location.replace.bind(window.location);
      window.location.assign=function(u){return origAssign(appendToUrl(u));};
      window.location.replace=function(u){return origReplace(appendToUrl(u));};
    }catch(e){}
    try{
      var proto=Object.getPrototypeOf(window.location)||window.Location&&window.Location.prototype;
      var desc=proto&&Object.getOwnPropertyDescriptor(proto,'href');
      if(desc&&desc.configurable&&desc.set){
        var origSet=desc.set;
        Object.defineProperty(window.location,'href',{configurable:true,get:desc.get.bind(window.location),set:function(v){origSet.call(window.location,appendToUrl(v));}});
      }
    }catch(e){}
    // Forms
    document.addEventListener('submit',function(e){
      var f=e.target;
      if(!f||f.tagName!=='FORM')return;
      var action=f.getAttribute('action')||location.href;
      var nu=appendToUrl(action);
      if(nu!==action)f.setAttribute('action',nu);
    },true);
    window.__utms=utms;
  })();
  </script>
