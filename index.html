    <!-- Persistência silenciosa de UTMs e fbclid (sem reload que penaliza o Meta Ads) -->
    <script>
    (function(){
      var KEYS=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','gclid','fbclid','src','sck','xcod'];
      var STORAGE_KEY='__utms';
      function parse(qs){var p=new URLSearchParams(qs||'');var o={};KEYS.forEach(function(k){var v=p.get(k);if(v)o[k]=v;});return o;}
      function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')||{};}catch(e){return {};}}
      function save(o){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(o)); localStorage.setItem('tracking_data',JSON.stringify(o));}catch(e){}}
      var fromUrl=parse(location.search);
      var stored=load();
      var utms=Object.assign({},stored,fromUrl);
      if(Object.keys(utms).length){
        save(utms);
        try{
          var u=new URL(location.href);
          var changed=false;
          Object.keys(utms).forEach(function(k){if(!u.searchParams.has(k)){u.searchParams.set(k,utms[k]);changed=true;}});
          if(changed)history.replaceState(history.state,'',u.pathname+u.search+u.hash);
        }catch(e){}
      }
      window.__utms=utms;
    })();
    </script>
